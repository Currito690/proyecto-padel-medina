<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pago procesado · Padel Medina</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; background:#F8FAFC; color:#0F172A; font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif; text-align:center; }
  p { font-size:16px; line-height:1.5; max-width:340px; margin:0 auto; }
  .n { margin-top:12px; font-size:13px; color:#64748B; visibility:hidden; }
</style>
</head>
<body>
<!-- Vuelta del pago en la app de iPhone: Redsys -> redsys-redirect -> aquí
     (?r=ok o ?r=ko). La app detecta esta página, cierra su pantalla de pago y
     sigue dentro de la app (ver src/utils/redsysPay.js). -->
<div>
  <p>Pago procesado. Volviendo a Padel Medina…</p>
  <p class="n" id="n">Si no vuelves en unos segundos, pulsa «Cerrar» arriba.</p>
</div>
<script>
  setTimeout(function () { document.getElementById('n').style.visibility = 'visible'; }, 4000);
</script>
</body>
</html>
