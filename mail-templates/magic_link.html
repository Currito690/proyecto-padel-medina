<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px; background: #f8fafc; border-radius: 12px;">
  <h2 style="color: #0F172A; text-align: center; margin-bottom: 8px;">Padel Medina</h2>
  <p style="color: #475569; text-align: center; margin-bottom: 32px;">Tu código de verificación</p>
  
  <div style="background: white; border-radius: 12px; padding: 32px; text-align: center; border: 1px solid #E2E8F0;">
    <p style="color: #64748B; margin: 0 0 16px;">Introduce este código en la aplicación:</p>
    <div style="font-size: 42px; font-weight: 800; letter-spacing: 12px; color: #0F172A; margin: 16px 0;">
      {{ .Token }}
    </div>
    <p style="color: #94A3B8; font-size: 13px; margin: 16px 0 0;">Válido durante 10 minutos</p>
  </div>

  <p style="color: #94A3B8; font-size: 12px; text-align: center; margin-top: 24px;">
    Si no has solicitado este código, ignora este mensaje.
  </p>
</div>
