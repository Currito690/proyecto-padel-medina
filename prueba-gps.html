<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Diagnóstico de ubicación</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0F172A; color: #E2E8F0; font-size: 15px; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  button { padding: 14px 18px; font-size: 16px; border: 0; border-radius: 10px; background: #16A34A; color: #fff; font-weight: 800; margin: 0 8px 12px 0; }
  .l { padding: 8px; border-bottom: 1px solid #1E293B; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .ok { color: #4ADE80; } .err { color: #F87171; } .info { color: #93C5FD; } .warn { color: #FBBF24; }
</style>
</head>
<body>
<h1>Diagnóstico de ubicación</h1>
<button id="pedir">Pedir ubicación</button>
<button id="seguir">Seguimiento 20 s</button>
<button id="nativo" style="background:#1B3A6E">Ubicación por la app</button>
<div id="log"></div>
<script>
  // Prueba del puente nativo: salta a la pantalla de la app y vuelve aquí con ?gps=
  var q = new URLSearchParams(location.search);
  if (q.get('gps')) {
    var d0 = document.createElement('div'); d0.className = 'l ok'; d0.textContent = 'VUELTA DE LA APP: gps=' + q.get('gps');
    document.getElementById('log').appendChild(d0);
  }
  document.getElementById('nativo').addEventListener('click', function () {
    var volver = location.origin + location.pathname;
    var intent = 'intent://ubicacion#Intent;scheme=padelmedina;package=com.padelmedina.app;S.volver=' + encodeURIComponent(volver) + ';end';
    var d = document.createElement('div'); d.className = 'l info'; d.textContent = 'Saltando a la app: ' + intent;
    document.getElementById('log').appendChild(d);
    location.href = intent;
  });
</script>

<script>
  var log = function (t, c) {
    var d = document.createElement('div');
    d.className = 'l ' + (c || '');
    d.textContent = t;
    document.getElementById('log').appendChild(d);
  };
  var MOTIVOS = { 1: 'PERMISO DENEGADO', 2: 'POSICION NO DISPONIBLE', 3: 'TIEMPO AGOTADO' };

  log('¿Dentro de la app?: ' + (window.matchMedia('(display-mode: standalone)').matches ? 'SI' : 'NO (navegador)'), 'info');
  log('Navegador: ' + navigator.userAgent, 'info');
  log('¿Existe geolocation?: ' + (navigator.geolocation ? 'si' : 'NO'), navigator.geolocation ? 'info' : 'err');

  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' })
      .then(function (p) { log('Permiso del sitio (Chrome): ' + p.state, p.state === 'granted' ? 'ok' : 'warn'); })
      .catch(function (e) { log('Permissions API falla: ' + e.message, 'err'); });
  } else {
    log('Sin Permissions API', 'warn');
  }

  function pedir(alta) {
    var t0 = Date.now();
    log('--- getCurrentPosition (precisión ' + (alta ? 'ALTA' : 'baja') + ') ---', 'info');
    navigator.geolocation.getCurrentPosition(
      function (p) {
        log('OK en ' + (Date.now() - t0) + ' ms\n' +
            'lat ' + p.coords.latitude.toFixed(5) + ', lng ' + p.coords.longitude.toFixed(5) + '\n' +
            'precisión ' + Math.round(p.coords.accuracy) + ' m' +
            (p.coords.accuracy > 500 ? '  ← APROXIMADA, no precisa' : '  ← precisa'), p.coords.accuracy > 500 ? 'warn' : 'ok');
      },
      function (e) {
        log('ERROR ' + e.code + ' (' + (MOTIVOS[e.code] || '?') + ') tras ' + (Date.now() - t0) + ' ms\n' + e.message, 'err');
      },
      { enableHighAccuracy: alta, timeout: 20000, maximumAge: 0 }
    );
  }

  document.getElementById('pedir').addEventListener('click', function () { pedir(true); setTimeout(function () { pedir(false); }, 1000); });

  document.getElementById('seguir').addEventListener('click', function () {
    log('--- watchPosition ---', 'info');
    var n = 0;
    var w = navigator.geolocation.watchPosition(
      function (p) { n++; log('lectura ' + n + ': precisión ' + Math.round(p.coords.accuracy) + ' m', 'ok'); },
      function (e) { log('watch ERROR ' + e.code + ' (' + (MOTIVOS[e.code] || '?') + '): ' + e.message, 'err'); },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
    setTimeout(function () {
      navigator.geolocation.clearWatch(w);
      log('Seguimiento parado. Lecturas: ' + n, n ? 'ok' : 'err');
    }, 20000);
  });
</script>
</body>
</html>
