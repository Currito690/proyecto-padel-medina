<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Prueba de ubicación</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0F172A; color: #E2E8F0; font-size: 15px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .l { padding: 6px 8px; border-bottom: 1px solid #1E293B; white-space: pre-wrap; word-break: break-word; }
  .ok { color: #4ADE80; } .err { color: #F87171; } .info { color: #93C5FD; }
</style>
</head>
<body>
<h1>Prueba de ubicación (temporal)</h1>
<div id="log"></div>
<script>
  const log = (txt, cls) => {
    const d = document.createElement('div');
    d.className = 'l ' + (cls || '');
    d.textContent = txt;
    document.getElementById('log').appendChild(d);
  };
  log('display-mode standalone: ' + window.matchMedia('(display-mode: standalone)').matches, 'info');
  log('userAgent: ' + navigator.userAgent, 'info');

  if (navigator.permissions) {
    navigator.permissions.query({ name: 'geolocation' })
      .then(p => log('Permissions API: ' + p.state, 'info'))
      .catch(e => log('Permissions API error: ' + e.message, 'err'));
  } else {
    log('Sin Permissions API', 'err');
  }

  const t0 = Date.now();
  navigator.geolocation.getCurrentPosition(
    p => log('getCurrentPosition OK en ' + (Date.now() - t0) + ' ms: ' + p.coords.latitude.toFixed(5) + ', ' + p.coords.longitude.toFixed(5) + ' (precisión ' + Math.round(p.coords.accuracy) + ' m)', 'ok'),
    e => log('getCurrentPosition ERROR ' + e.code + ': ' + e.message, 'err'),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );

  let n = 0;
  const w = navigator.geolocation.watchPosition(
    p => { n++; log('watchPosition #' + n + ': ' + p.coords.latitude.toFixed(5) + ', ' + p.coords.longitude.toFixed(5) + ' (precisión ' + Math.round(p.coords.accuracy) + ' m)', 'ok');
           if (n >= 3) { navigator.geolocation.clearWatch(w); log('watchPosition detenido tras 3 lecturas', 'info'); } },
    e => log('watchPosition ERROR ' + e.code + ': ' + e.message, 'err'),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );

  setTimeout(() => { if (n === 0) log('watchPosition: sin lecturas tras 25 s', 'err'); }, 25000);
</script>
</body>
</html>
